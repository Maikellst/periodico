<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
<!-- Cabecera sin span -->
<header class="bg-primary text-white py-5 border-bottom shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="fw-bold m-0">FORTNITE NEWS</h1>
    <p class="badge bg-warning text-dark fw-bold text-uppercase m-0">Las mejor pagina de noticias de fortnite</p>
  </div>
</header>
<!-- Menú de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuFortnite">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuFortnite">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
        <li class="nav-item"><a class="nav-link active" href="#">Battle Royale</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Modo Recarga</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Competitivo</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Tienda de Objetos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Emisiones en vivo</a></li>
      </ul>
    </div>
  </div>
</nav>
<!-- Estructura del cuerpo principal -->
<main class="container my-4">
  <div class="row g-4">
    <!-- Columna izquierda: Noticia principal + 6 secundarias -->
    <div class="col-lg-8" id="noticias-container"></div>

    <!-- Columna derecha: Barra lateral -->
    <div class="col-lg-4" id="sidebar-container"></div>
  </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
